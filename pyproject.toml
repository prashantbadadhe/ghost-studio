[project]
name = "ghost-studio"
version = "0.1.0"
description = "Ghost Studio — Enterprise PII Redaction Platform for Banking & Financial Services"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24.0",
    "openai>=1.30.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "aiofiles>=23.2.1",
    "pillow>=10.3.0",
    "python-docx>=1.1.0",
    "httpx>=0.28.1",
]

[project.scripts]
ghost-studio = "ghost_studio.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghost_studio"]
